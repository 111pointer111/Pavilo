<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef4f2">
  <title>语亭值班</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <section class="login" id="loginScreen">
    <div class="login-card">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 256 256">
          <path fill="#0f7772" d="M127 46C119 47 113 61 105 69C87 87 66 99 37 108C30 110 32 119 40 124L51 129V199C51 205 56 210 63 210H84L98 189C87 186 81 180 81 171V142C81 133 86 129 95 122C111 111 122 101 129 89C137 103 147 113 161 122C171 129 175 135 175 143V171C175 183 168 190 156 192H116C108 194 102 201 96 207C92 210 94 210 101 210H193C200 210 205 205 205 198V129L217 123C225 119 225 110 219 108C187 98 166 84 152 70L134 48C132 45 130 45 127 46Z"/>
          <circle cx="196.7" cy="71.7" r="15.1" fill="#e86f57"/>
        </svg>
      </span>
      <p class="flag" data-i18n="login.flag">OPERATOR / 值班台</p>
      <h1 data-i18n-html="login.title">管亭，<br>不进场。</h1>
      <p class="copy" data-i18n="login.copy">这里只给部署者配置模型渠道和查看用量。</p>
      <form id="loginForm">
        <label for="tokenInput" data-i18n="login.label">Operator token</label>
        <div class="login-row">
          <input id="tokenInput" name="token" type="password" autocomplete="current-password" required>
          <button type="submit" data-i18n="login.submit">进入值班</button>
        </div>
        <p class="error" id="loginError" role="alert"></p>
      </form>
      <div class="lang-row">
        <button type="button" class="text-btn lang" data-lang="zh-CN" data-i18n="lang.zh">中文</button>
        <button type="button" class="text-btn lang" data-lang="en" data-i18n="lang.en">English</button>
      </div>
    </div>
  </section>

  <div class="shell" id="desk" hidden>
    <aside class="rail">
      <a class="rail-brand" href="#/overview" data-i18n="brand.name">语亭值班</a>
      <p class="rail-kicker" data-i18n="nav.groupPavilo">语亭</p>
      <nav class="rail-nav" aria-label="pavilo">
        <a href="#/overview" data-nav="overview" data-i18n="nav.overview">总览</a>
        <a href="#/room" data-nav="room" data-i18n="nav.room">房间</a>
        <a href="#/chat" data-nav="chat" data-i18n="nav.chat">聊天频道</a>
      </nav>
      <p class="rail-kicker" data-i18n="nav.groupGateway">AI 网关</p>
      <nav class="rail-nav" aria-label="gateway">
        <a href="#/gateway" data-nav="gateway" data-i18n="nav.gateway">网关</a>
        <a href="#/gateway/channels" data-nav="gateway-channels" data-i18n="nav.channels">模型渠道</a>
        <a href="#/gateway/usage" data-nav="gateway-usage" data-i18n="nav.usage">用量</a>
      </nav>
      <div class="rail-foot">
        <button type="button" class="text-btn lang" data-lang="zh-CN" data-i18n="lang.zh">中文</button>
        <button type="button" class="text-btn lang" data-lang="en" data-i18n="lang.en">English</button>
        <button type="button" class="text-btn" id="logoutButton" data-i18n="top.logout">退出</button>
      </div>
    </aside>
    <div class="stage">
      <header class="stage-head">
        <p class="crumb" id="pageCrumb"></p>
        <h1 id="pageTitle"></h1>
        <p class="lead" id="pageLead"></p>
      </header>

      <section class="view" id="viewOverview" hidden>
        <div class="cards" id="overviewCards"></div>
        <div class="next" id="overviewNext"></div>
      </section>

      <section class="view" id="viewRoom" hidden>
        <form class="editor paper" id="roomForm">
          <p class="source-line"><span class="source-badge" id="roomSource"></span></p>
          <p class="error" id="roomLoadError" hidden></p>
          <div class="grid">
            <label>
              <span data-i18n="room.title">房间标题</span>
              <input name="title" required maxlength="80">
            </label>
            <label>
              <span data-i18n="room.defaultLanguage">默认语言</span>
              <select name="defaultLanguage">
                <option value="zh-CN">中文</option>
                <option value="en">English</option>
              </select>
            </label>
            <label>
              <span data-i18n="room.defaultChannel">默认频道</span>
              <select name="defaultChannel" id="roomDefaultChannel"></select>
            </label>
            <label>
              <span data-i18n="room.maxUsers">全站人数上限</span>
              <input name="maxUsers" type="number" min="1" required>
              <small id="roomMaxUsersHint"></small>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" name="exposeMemberIps">
            <span data-i18n="room.exposeMemberIps">向成员显示彼此的 IP</span>
          </label>
          <label class="check">
            <input type="checkbox" name="exposeLanUrls">
            <span data-i18n="room.exposeLanUrls">在入口信息里列出局域网地址</span>
          </label>
          <div class="actions">
            <button type="submit" id="roomSaveButton" data-i18n="room.save">保存</button>
            <button type="button" id="roomRevertButton" class="danger" data-i18n="room.revert">恢复为配置文件</button>
          </div>
        </form>
      </section>

      <section class="view" id="viewChat" hidden>
        <p class="source-line"><span class="source-badge" id="chatSource"></span></p>
        <p class="error" id="chatLoadError" hidden></p>
        <div class="toolbar">
          <a class="button" href="#/chat/new" id="chatAddButton" data-i18n="chat.add">添加聊天频道</a>
          <button type="button" class="button ghost" id="chatRevertButton" data-i18n="chat.revert">恢复为配置文件</button>
        </div>
        <div id="chatList"></div>
      </section>

      <section class="view" id="viewChatForm" hidden>
        <p><a class="back" href="#/chat" data-i18n="chat.back">返回聊天频道</a></p>
        <form class="editor paper" id="chatForm">
          <div class="grid">
            <label>
              <span data-i18n="chat.id">频道 ID</span>
              <input name="id" required pattern="[a-z0-9][a-z0-9_-]{0,31}" maxlength="32">
              <small data-i18n="chat.idHint">保存后不能改。</small>
            </label>
            <label>
              <span data-i18n="chat.name">显示名</span>
              <input name="name" required maxlength="40">
            </label>
            <label class="wide">
              <span data-i18n="chat.description">说明</span>
              <input name="description" maxlength="160">
            </label>
            <label>
              <span data-i18n="chat.maxUsers">人数上限</span>
              <input name="maxUsers" type="number" min="1" required>
            </label>
            <label id="chatPlayRow">
              <span data-i18n="chat.play">绑定玩法</span>
              <select name="play" id="chatPlay"></select>
            </label>
            <label class="wide">
              <span data-i18n="chat.welcome">欢迎语</span>
              <textarea name="welcome" rows="5" maxlength="2000"></textarea>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" name="enabled" checked>
            <span data-i18n="chat.enabled">启用这个频道</span>
          </label>
          <label class="check">
            <input type="checkbox" name="readOnly">
            <span data-i18n="chat.readOnly">只读（所有人不能发言）</span>
          </label>
          <p class="lead" data-i18n="chat.deleteHint">删除只从目录拿掉，同名再建会接到旧记录。</p>
          <div class="actions">
            <button type="submit" id="chatSaveButton" data-i18n="chat.save">保存</button>
            <button type="button" id="chatDeleteButton" class="danger" data-i18n="chat.delete">删除</button>
          </div>
        </form>
      </section>

      <section class="view" id="viewGateway" hidden>
        <div class="cards" id="gatewayCards"></div>
        <div class="next" id="gatewayNext"></div>
      </section>

      <section class="view" id="viewChannels" hidden>
        <div class="toolbar">
          <a class="button" href="#/gateway/channels/new" data-i18n="channels.add">添加渠道</a>
        </div>
        <div id="channelList"></div>
      </section>

      <section class="view" id="viewChannelForm" hidden>
        <p><a class="back" href="#/gateway/channels" data-i18n="channel.back">返回渠道列表</a></p>
        <form class="editor paper" id="channelForm">
          <div class="grid">
            <label>
              <span data-i18n="channel.id">渠道 ID</span>
              <input name="id" required pattern="[a-z0-9][a-z0-9_-]{0,31}" maxlength="32">
              <small data-i18n="channel.idHint">保存后不能改。</small>
            </label>
            <label>
              <span data-i18n="channel.preset">类型</span>
              <select name="preset">
                <option value="deepseek">DeepSeek</option>
                <option value="openai-compatible">OpenAI compatible</option>
              </select>
            </label>
            <label>
              <span data-i18n="channel.label">显示名</span>
              <input name="label" maxlength="80">
            </label>
            <label>
              <span data-i18n="channel.model">模型</span>
              <input name="model" maxlength="128">
            </label>
            <label class="wide">
              <span data-i18n="channel.baseUrl">接口地址</span>
              <input name="baseUrl" maxlength="2048" placeholder="https://api.deepseek.com/v1">
            </label>
            <label class="wide">
              <span data-i18n="channel.apiKey">API key</span>
              <input name="apiKey" type="password" autocomplete="off">
              <small id="keyHelp"></small>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" name="enabled" checked>
            <span data-i18n="channel.enabled">启用这条渠道</span>
          </label>
          <div class="actions">
            <button type="submit" id="saveButton" data-i18n="channel.save">保存</button>
            <button type="button" id="probeButton" data-i18n="channel.probe">探测连通</button>
            <button type="button" id="deleteButton" class="danger" data-i18n="channel.delete">删除</button>
          </div>
        </form>
      </section>

      <section class="view" id="viewUsage" hidden>
        <div class="paper" id="usageBox"></div>
      </section>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/admin/i18n.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
