# Pavilo 配置示例
#
# 本文件展示所有可配置项及其**代码默认值**。
# 每个配置项的注释中会标注"代码默认值"，这是未提供配置文件时的实际行为。
#
# 使用方法：
#   1. 复制此文件为 pavilo.yaml
#   2. 根据需求修改配置项
#   3. 重启 Pavilo 使配置生效（配置不支持热加载）
#
# 注意：
#   - pavilo.yaml 已在 .gitignore 中，不会被 Git 追踪
#   - 配置文件不在 HTTP 静态白名单内，不会被外部访问
#   - 请勿将配置文件放入 vendor/ 或 client/ 目录
#   - 调优建议见文件底部的"配置调优建议"章节

# 配置文件版本（必填，1 或 2）
#   1：与 v1.0 相同，禁止出现 storage，内部归一为 memory
#   2：允许可选 storage（省略则仍为 memory）
# 代码默认值：无配置文件时等价于 version 1 + memory
version: 1

# ============================================================================
# 服务器配置
# ============================================================================
server:
  # 监听地址
  #   0.0.0.0 - 允许局域网内其他设备访问（推荐用于团队协作）
  #   127.0.0.1 - 仅允许本机访问（更安全，适合单人使用或开发）
  host: 0.0.0.0

  # 监听端口
  #   可通过环境变量 PORT 覆盖此设置
  #   例如：PORT=8080 npm start
  port: 4173

  # 全局最大用户数
  #   包含活跃用户和断线租约期内可恢复身份的用户
  #   各频道的 maxUsers 不得超过此值
  maxUsers: 64

  # 最大 WebSocket 连接数
  #   未加入聊天的连接也会占用此配额
  #   通常设置为 maxUsers 的 1.2-1.5 倍，留出连接建立和恢复的缓冲
  maxConnections: 80

  # 单个 IP 最大连接数
  #   防止单一来源占用过多连接
  #   注意：反向代理环境下可能所有用户显示为同一 IP
  maxConnectionsPerIp: 12

  # 是否允许不带 Origin 头的 WebSocket 连接
  #   代码默认值：true（为了兼容性，允许非浏览器客户端）
  #   true - 允许命令行工具、某些代理客户端连接
  #   false - 仅允许浏览器等带 Origin 的标准客户端（更安全）
  #   生产环境建议：在可信网络内使用 true；公网部署建议 false
  allowNoOrigin: true

  # 允许的跨域 Origin 列表
  #   同源请求始终允许，无需配置
  #   反向代理场景需要列出外部域名（不含路径）
  #   例如：['https://chat.example.com', 'https://team.example.com']
  allowedOrigins: []

# ============================================================================
# 房间配置
# ============================================================================
room:
  # 房间标题（显示在浏览器标签页和页面顶部）
  #   代码默认值：'语亭 · 临时频道'
  #   可根据团队或项目自定义
  title: 语亭 · 临时频道

  # 默认频道 ID
  #   用户加入时未指定频道则进入此频道
  #   必须在 channels 列表中存在且 enabled: true
  #   默认频道不能是 readOnly: true 的频道
  defaultChannel: general

  # 是否向频道成员显示彼此的 IP 地址
  #   true - 显示 IP（当前产品默认行为，适合可信局域网）
  #   false - 隐藏 IP（更注重隐私，但仍用于连接限制）
  exposeMemberIps: true

  # 是否在 /room-info 接口暴露局域网地址
  #   true - 列出主机所有局域网 IP，方便分享给同网段用户
  #   false - 返回空数组，不暴露主机网络位置
  exposeLanUrls: true

  # 首次访问时的默认界面语言（用户可在页面内切换，选择会写入 localStorage）
  #   代码默认值：zh-CN
  #   仅接受 zh-CN 或 en
  defaultLanguage: zh-CN

# ============================================================================
# 频道配置
# ============================================================================
# 提供此数组会完整替换内置默认频道（general 和 project）
# 不提供则使用内置默认频道，其 maxUsers 会自动收紧到 server.maxUsers
channels:
  # 示例：通用闲聊频道
  - id: general
    name: 闲聊
    description: 轻松聊聊，只留当下。
    enabled: true
    maxUsers: 64

  # 示例：项目讨论频道（人数上限更小）
  - id: project
    name: 项目讨论
    description: 聚焦项目，高效协作。
    enabled: true
    maxUsers: 32

  # 示例：只读公告频道
  # readOnly: true 表示所有人都不能发消息（没有例外，也没有管理员豁免），
  # 但频道仍可进入、可浏览、可用表情回应。
  # 内容通过 welcome 由部署者维护，改完需要重启进程。
  - id: announcements
    name: 公告
    description: 版本与维护通知。
    enabled: true
    readOnly: true
    maxUsers: 64
    welcome: |
      这里只发布版本与维护通知。
      1. 讨论请去 #general
      2. 通知由部署者在配置中维护，改完需要重启服务

# ============================================================================
# 容量与尺寸限制
# ============================================================================
limits:
  # 每个频道最多保留的消息条数
  #   超过后按 FIFO（先进先出）淘汰最旧消息
  maxMessagesPerChannel: 300

  # 单条文本消息最大字符数
  #   代码默认值：2000
  #   建议值：1000-4000，根据使用场景调整
  maxTextLength: 2000

  # 单张图片最大字节数（Base64 编码后）
  #   重要：此值直接决定频道能保留多少张图片
  #   - 300KB 时约能保留 79 张图（基于 32MB 频道预算）
  #   - 1.5MB 时只能保留约 16 张图
  #   客户端会自动将图片长边降到 1600px，手机照片通常远小于此上限
  maxImageBytes: 300000

  # 图片单边最大像素（仅约束不降采样的 GIF）
  #   普通图片（PNG/JPEG/WebP）会被客户端统一降到 1600px
  maxImageDimension: 1600

  # 上传图片解码前的最大像素总数
  #   限制单次上传的内存开销，防止超大图片导致崩溃
  #   4,000,000 像素 ≈ 2000×2000 或 2500×1600
  maxImagePixels: 4000000

  # 单个 JSON 消息最大字节数
  #   必须能容纳最大图片的 Base64 + 消息元数据
  #   建议值：至少是 maxImageBytes 的 1.5-2 倍
  maxJsonBytes: 524288

  # WebSocket 单帧最大字节数
  #   代码默认值：1572864 (1.5 MB)
  #   必须能容纳最大 JSON 消息 + 协议开销
  #   建议值：maxJsonBytes 的 1.2-1.5 倍
  maxWebSocketFrameBytes: 1572864

  # 每个频道最大总字节数（所有消息 JSON 之和）
  #   超过后按 FIFO 淘汰最旧消息
  #   32MB 可存约 100-300 条混合消息（文字+图片）
  maxChannelBytes: 33554432

  # 单个慢连接的最大写缓冲
  #   超过此值的慢连接会被断开，防止拖慢整个服务
  maxWritableBytes: 2097152

  # 消息去重缓存最大条目数
  #   用于防止网络重传导致的重复消息
  #   建议值：预期并发用户数 × 8-16
  maxDedupeEntries: 512

# ============================================================================
# 超时配置（单位：毫秒）
# ============================================================================
timeouts:
  # WebSocket 连接建立后多久内必须发送 join 命令
  #   代码默认值：12000 (12秒)
  #   超时未加入会被断开（1008 / join timeout）
  #   调优建议：慢速网络可适当增大
  joinMs: 12000

  # 心跳发送间隔
  #   服务端每隔此时间向客户端发送 ping
  heartbeatIntervalMs: 30000

  # 心跳超时时间
  #   代码默认值：75000 (75秒)
  #   客户端在此时间内未响应 pong 则被视为断线
  #   建议值：heartbeatIntervalMs 的 2-3 倍
  heartbeatTimeoutMs: 75000

  # 输入状态（typing）自动过期时间
  #   用户停止输入后，此时间后自动取消"正在输入"状态
  typingTtlMs: 4000

  # 断线后身份保留时间（Session Lease）
  #   意外断线（非主动离开）后，用户身份和名称保留此时间
  #   期间可用原 token 恢复，过期后释放名额并广播离开
  #   设为 0 表示断线立即释放（不推荐，影响刷新体验）
  sessionLeaseMs: 15000

  # 消息去重缓存保留时间
  #   超过此时间的去重记录会被清理
  #   建议值：5-10 分钟，覆盖典型的网络波动周期
  dedupeTtlMs: 600000

# ============================================================================
# 频率限制（Rate Limiting）
# ============================================================================
rateLimits:
  # 限流时间窗口（单位：毫秒）
  #   代码默认值：5000 (5秒)
  #   在此时间窗口内，每个连接最多发送以下数量的命令
  windowMs: 5000

  # 时间窗口内最多发送的消息数
  #   代码默认值：8
  #   包含文本和图片消息
  #   调优建议：5-20 条，根据场景调整
  messages: 8

  # 时间窗口内最多发送的回应（reaction）数
  #   代码默认值：20
  #   回应操作通常比发消息更频繁
  #   调优建议：20-50 次，根据活跃度调整
  reactions: 20

  # 时间窗口内最多发送的输入状态更新数
  #   代码默认值：12
  #   防止输入状态更新过于频繁
  #   调优建议：10-15 次
  typing: 12

# ============================================================================
# 配置调优建议
# ============================================================================
#
# 小团队（< 10人）：
#   - maxUsers: 16
#   - maxConnections: 24
#   - maxMessagesPerChannel: 200
#   - maxImageBytes: 500000（可保留更高质量图片）
#
# 中型团队（10-50人）：
#   - maxUsers: 64
#   - maxConnections: 80
#   - maxMessagesPerChannel: 300
#   - maxImageBytes: 300000
#
# 大型团队（50+人）：
#   - maxUsers: 128
#   - maxConnections: 160
#   - maxMessagesPerChannel: 500
#   - maxImageBytes: 200000（降低单图大小以支持更多消息）
#   - 考虑增加 maxChannelBytes 到 64MB 或更高
#
# 图片密集型使用场景：
#   - maxImageBytes: 500000-1000000
#   - maxChannelBytes: 67108864（64MB）或更高
#   - maxJsonBytes、maxWebSocketFrameBytes 需相应增加
#
# 文本为主场景：
#   - maxImageBytes: 100000-200000
#   - maxMessagesPerChannel: 500-1000
#   - 可以降低 maxChannelBytes 节省内存
#
# ============================================================================
# 可选持久化（需要 version: 2，默认不启用）
# ============================================================================
#
# 把上面的 version 改为 2，并增加：
#
# storage:
#   driver: sqlite
#   sqlite:
#     path: ./data/pavilo.db
#     engine: auto          # auto | node | better-sqlite3
#     retentionDays: 30     # 1–3650；省略=30；永久用 null 或 forever（禁止 0）
#
# driver: memory 时不要写 sqlite 子块，否则配置会被拒绝。
# 单进程使用：不要让两个 Pavilo 实例共享同一个 db 文件。
#
# ============================================================================
