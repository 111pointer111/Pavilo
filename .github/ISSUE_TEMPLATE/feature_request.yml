name: 功能建议
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！在提交前，请先查看 [ROADMAP.md](https://github.com/你的用户名/Pavilo/blob/main/ROADMAP.md) 确认是否已在计划中。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么痛点？
      placeholder: 例如：每次服务重启后聊天记录都消失了，我希望能保留历史
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 你希望如何解决这个问题？
      placeholder: 例如：增加可选的 SQLite 持久化模式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 还有其他解决方式吗？
      placeholder: 例如：也可以用 PostgreSQL，但对小团队来说太重了

  - type: dropdown
    id: priority
    attributes:
      label: 优先级（你的看法）
      options:
        - 高 - 没有这个功能无法使用 Pavilo
        - 中 - 有这个功能会更好
        - 低 - nice to have
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 这个功能在什么场景下有用？
      placeholder: |
        例如：
        - 10 人小团队，希望保留一周的讨论记录
        - 需要在停服升级后恢复聊天状态
    validations:
      required: true

  - type: checkboxes
    id: alignment
    attributes:
      label: 与产品定位的一致性
      description: 请确认这个功能符合 Pavilo 的核心定位
      options:
        - label: 我已阅读 [架构原则](https://github.com/你的用户名/Pavilo/blob/main/docs/architecture/principles.md)
          required: true
        - label: 这个功能不违反 "Ephemeral First" 原则（或我理解这是可选功能）
          required: true
        - label: 这个功能适合自托管场景，不需要云服务依赖
          required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何可能有帮助的额外信息
