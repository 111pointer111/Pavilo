name: 功能建议
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！在提交前，请先查看 [ROADMAP.md](https://github.com/caigg188/Pavilo/blob/main/ROADMAP.md)，区分当前能力、主分支未发布能力和 v2.0 规划。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么痛点？
      placeholder: 例如：希望把现成聊天界面接入已有产品，并复用宿主登录
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 你希望如何解决这个问题？
      placeholder: 例如：部署 Pavilo 后，用接入 SDK 挂载预建讨论频道
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 还有其他解决方式吗？
      placeholder: 例如：也可以自建聊天，但想复用现成界面、治理和玩法

  - type: dropdown
    id: priority
    attributes:
      label: 优先级（你的看法）
      options:
        - 高 - 没有这个功能无法使用 Pavilo
        - 中 - 有这个功能会更好
        - 低 - nice to have
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 这个功能在什么场景下有用？
      placeholder: |
        例如：
        - 小型社区已有账号系统，希望接入预建讨论频道
        - 产品里需要聊天＋玩法，但不想改 Pavilo 源码
    validations:
      required: true

  - type: checkboxes
    id: alignment
    attributes:
      label: 与产品定位的一致性
      description: 请确认这个功能符合 Pavilo 的核心定位
      options:
        - label: 我已阅读 [架构原则](https://github.com/caigg188/Pavilo/blob/main/docs/architecture/principles.md) 和 [路线图](https://github.com/caigg188/Pavilo/blob/main/ROADMAP.md)
          required: true
        - label: 这个功能不违反 "Ephemeral First" 原则（或我理解这是可选功能）
          required: true
        - label: 这个功能适合自托管场景，不需要云服务依赖
          required: true
        - label: 这个功能不在路线图「明确暂缓」范围内（或我已说明真实场景）
          required: true

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 任何可能有帮助的额外信息
